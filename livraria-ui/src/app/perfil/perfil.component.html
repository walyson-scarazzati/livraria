<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="form-horizontal">
    <input type="hidden" name="id" [ngModel]="role.id">
    <div class="form-group" [ngClass]="aplicaCssErro(descricao)">

        <div class="col-sm-12">
            <label for="descricao" class="control-label">Descrição</label>
        </div>

        <div class="col-sm-12">
            <input type="text" class="form-control" name="descricao" id="descricao" placeholder="Descrição" [ngModel]="role.descricao" [readonly]="!isDetalhe" required #descricao="ngModel">

            <app-campo-control-erro [mostrarErro]="verificaValidTouched(descricao)" msgErro="Descrição é obrigatório.">
            </app-campo-control-erro>
        </div>
    </div>

    <div class="form-group">
        <div class="row">
            <div class="col-sm-1">
                <button type="submit" class="btn btn-info" (click)="gotoList()">Voltar</button>
            </div>
            <div class="col-sm-1" *ngIf="isDetalhe">
                <button type="submit" class="btn btn-success">{{isSalvarOuEditar ? 'Salvar' : 'Editar'}}</button>
            </div>
        </div>
    </div>
</form>
